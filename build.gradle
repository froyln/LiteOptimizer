buildscript {
    repositories {
        maven { name = 'forge'; url = 'https://maven.minecraftforge.net' }
        maven { name = 'sponge'; url = 'https://repo.spongepowered.org/repository/maven-public' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
        classpath 'org.spongepowered:mixingradle:0.6-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.liteloader'
apply plugin: 'org.spongepowered.mixin'

repositories {
    maven { name = 'sponge'; url = 'https://repo.spongepowered.org/repository/maven-public' }
}

minecraft {
    version = project.minecraft_version
    mappings = project.mappings_version
    runDir = 'run'
    makeObfSourceJar = false
    replaceIn 'LiteModLiteOptimizer.java'
    replace '@MOD_VERSION@', project.mod_version
}

compileJava {
    sourceCompatibility = 1.8
    targetCompatibility = 1.8
    options.encoding = 'UTF-8'
}

sourceSets {
    main {
        ext.refMap = 'mixins.' + project.mod_id + '.refmap.json'
    }
}

group = 'dev.froyln'
archivesBaseName = project.mod_file_name
version = project.mod_version

litemod {
    json {
        name = project.mod_id
        displayName = project.mod_name
        mcversion = project.minecraft_version
        version = project.mod_version
        author = project.author
        mixinConfigs = ['mixins.' + project.mod_id + '.json']
    }
}

jar {
    classifier = ''
    baseName = archivesBaseName
    from litemod.outputs
}

mixin {
    defaultObfuscationEnv notch
}
